<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="fav-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="fav-mint" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="fav-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
    <filter id="fav-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Backing Tile: Deep Glass Shield -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="#070d1d" stroke="url(#fav-primary)" stroke-opacity="0.4" stroke-width="1.5" />
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#fav-glass)" />

  <!-- Outer Precision Ribbon 'D' -->
  <path
    d="M 18 16
       C 18 13.5, 20 12, 23 12
       L 36 12
       C 46 12, 54 20, 54 32
       C 54 44, 46 52, 36 52
       L 23 52
       C 20 52, 18 50.5, 18 48
       Z"
    fill="#081024"
    stroke="url(#fav-primary)"
    stroke-width="2.2"
  />

  <!-- Specular Rim highlight -->
  <path
    d="M 19 13 L 36 13 C 44 13, 51 19, 53 28"
    stroke="#ffffff"
    stroke-opacity="0.6"
    stroke-width="1.5"
    stroke-linecap="round"
  />

  <!-- Inner Fluid Wave Stream -->
  <path
    d="M 27 22 L 40 22 C 43 22, 46 24.5, 46 27.5 C 46 30.5, 43 33, 40 33 L 27 33 L 27 42"
    stroke="url(#fav-primary)"
    stroke-width="3.5"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Velocity Particle -->
  <circle cx="43" cy="33" r="3.5" fill="#10b981" filter="url(#fav-glow)" />
  <circle cx="43" cy="33" r="1.5" fill="#ffffff" />
</svg>
