<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="df-grad-primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="df-grad-accent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background container tile -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#090d1a" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="1.5" />

  <!-- Back Layer Document (Subtle depth) -->
  <rect x="20" y="10" width="28" height="38" rx="6" fill="#0ea5e9" fill-opacity="0.18" stroke="#0ea5e9" stroke-opacity="0.4" stroke-width="1.2" transform="rotate(7, 34, 29)" />

  <!-- Main Front Document -->
  <rect x="14" y="14" width="30" height="40" rx="7" fill="url(#df-grad-primary)" filter="url(#glow)" />
  <rect x="14" y="14" width="30" height="40" rx="7" fill="#080e1e" fill-opacity="0.88" />
  <rect x="14" y="14" width="30" height="40" rx="7" stroke="url(#df-grad-primary)" stroke-width="1.8" />

  <!-- Flow Lines inside document -->
  <rect x="20" y="23" width="14" height="2.5" rx="1.25" fill="#00f2fe" />
  <rect x="20" y="29" width="18" height="2.5" rx="1.25" fill="#38bdf8" />
  <rect x="20" y="35" width="12" height="2.5" rx="1.25" fill="#38bdf8" fill-opacity="0.6" />

  <!-- Dynamic Async Speed Particle / Arrow (Signifying Async Flow) -->
  <circle cx="42" cy="42" r="11" fill="#090d1a" stroke="url(#df-grad-accent)" stroke-width="2" />
  <path d="M37 42.5L41 46.5L47 38.5" stroke="#10b981" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" />
</svg>
