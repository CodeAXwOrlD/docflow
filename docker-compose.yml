version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: docflow
      POSTGRES_PASSWORD: docflow_secret
      POSTGRES_DB: docflow_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docflow -d docflow_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://docflow:docflow_secret@postgres:5432/docflow_db
      SYNC_DATABASE_URL: postgresql://docflow:docflow_secret@postgres:5432/docflow_db
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      ENVIRONMENT: "development"
      SECRET_KEY: "${SECRET_KEY:-docflow-super-secret-key-change-in-production}"
      ENCRYPTION_MASTER_KEY: "${ENCRYPTION_MASTER_KEY:-}"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: bash -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://docflow:docflow_secret@postgres:5432/docflow_db
      SYNC_DATABASE_URL: postgresql://docflow:docflow_secret@postgres:5432/docflow_db
      REDIS_URL: redis://redis:6379/0
      UPLOAD_DIR: /app/uploads
      ENVIRONMENT: "development"
      SECRET_KEY: "${SECRET_KEY:-docflow-super-secret-key-change-in-production}"
      ENCRYPTION_MASTER_KEY: "${ENCRYPTION_MASTER_KEY:-}"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=4

  celery_flower:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5555:5555"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - celery_worker
    command: celery -A app.workers.celery_app flower --port=5555

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_DEMO_MODE: "false"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
